<!DOCTYPE html>
<html lang="{{ site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ site.Home.RelPermalink }}">kubectl-plugins</a>
    <nav>
      {{ range site.Menus.main }}<a href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}
      <a href="{{ site.Params.repo }}">GitHub</a>
    </nav>
  </header>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer>Documentation for <a href="{{ site.Params.repo }}">rnemeth90/awesome-kubectl-plugins</a>.</footer>
</body>
</html>
