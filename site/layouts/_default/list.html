{{ define "main" }}
<main class="wrap">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  {{ if .Pages }}
  <ul class="cards">
    {{ range .Pages.ByWeight }}
    <li><a href="{{ .RelPermalink }}">
      <span class="tag">{{ .Params.category }}</span>
      <strong>{{ .Title }}</strong>
      <span class="desc">{{ .Description }}</span>
    </a></li>
    {{ end }}
  </ul>
  {{ end }}
</main>
{{ end }}
